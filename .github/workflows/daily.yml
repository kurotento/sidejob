name: daily-build

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 7:00 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04  # 10/19 からの ubuntu-latest 切り替えに備えて固定
    services:
      voicevox:  # ずんだもんの音声合成（YouTube ショート用）
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: |
          pip install --quiet Pillow numpy
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg > /dev/null
      - name: Build site
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python build.py 2>&1 | tee data/build_log.txt
      - name: Commit ranking history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) ranking snapshot"
          # 実行中に main が進んでいたら取り込んでから再度 push（最大3回）
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04  # 10/19 からの ubuntu-latest 切り替えに備えて固定
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  social:
    needs: deploy
    runs-on: ubuntu-24.04  # 10/19 からの ubuntu-latest 切り替えに備えて固定
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schedule X posts on Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python social.py
      - name: Commit posting record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: X posting record"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
