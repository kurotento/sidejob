name: daily-build

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 7:00 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: |
          pip install --quiet Pillow
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
      - name: Build site
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python build.py 2>&1 | tee data/build_log.txt
      - name: Commit ranking history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) ranking snapshot"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
